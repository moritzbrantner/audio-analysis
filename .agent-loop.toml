schema_version = 1
# Queue issues sequentially: a PR must be fully integrated before the next
# issue can be claimed, so every run has one unambiguous baseline.
max_workers = 1

[verification]
# Restructuring-first extraction evidence is intentionally structural.
commands = [
  "git diff --check",
  "python3 scripts/check_extraction.py",
  "cargo metadata --format-version 1 --no-deps",
]
