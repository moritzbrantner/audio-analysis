schema_version = 1
# Queue issues sequentially: a PR must be fully integrated before the next
# issue can be claimed, so every run has one unambiguous baseline.
max_workers = 1

[verification]
# Agent Loop owns the deterministic handoff gate. Exhaustive adapter/feature,
# documentation, packaging, and resource-backed CUDA evidence stay outside the
# repeated model loop and are verified by hosted preflight or explicit hardware runs.
commands = [
  "bash scripts/check-handoff.sh",
]
