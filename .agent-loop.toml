schema_version = 1
# Queue issues sequentially: a PR must be fully integrated before the next
# issue can be claimed, so every run has one unambiguous baseline.
max_workers = 1

[verification]
# Agent Loop verification is the one-time handoff gate, not the repeated
# development inner loop and not the exhaustive hosted/release preflight.
commands = [
  "bash scripts/check-handoff.sh",
]
