name: Bootstrap narrow WebGPU contract

on:
  push:
    branches:
      - feat/webgpu-whisper-contract-refresh

permissions:
  contents: write

env:
  CODING_TOOLING_REV: c9e071995abf65d2326930efb05e47e585af0efd

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          fetch-depth: 0
          ref: feat/webgpu-whisper-contract-refresh

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.95.0
          targets: wasm32-unknown-unknown

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0

      - name: Refresh registry lockfile
        run: cargo generate-lockfile

      - name: Checkpoint lockfile before source mode
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git diff --cached --check
          git commit -m "chore: refresh WebGPU dependency lock"

      - name: Prepare pinned source workspaces
        shell: bash
        run: |
          set -euo pipefail
          git init ../coding-tooling
          git -C ../coding-tooling fetch --depth=1 https://github.com/moritzbrantner/coding-tooling.git "$CODING_TOOLING_REV"
          git -C ../coding-tooling checkout --detach FETCH_HEAD
          (cd ../coding-tooling && bun install --frozen-lockfile)

          FOUNDATION_REV="$(python3 - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path('.coding-tooling.source-deps.json').read_text())
          revisions = {
              patch['rev']
              for patch in manifest['cargo']['patches']
              if patch['git'] == 'https://github.com/moritzbrantner/moenarch-foundation'
          }
          if len(revisions) != 1:
              raise SystemExit(f'expected one Foundation revision, found {sorted(revisions)}')
          print(revisions.pop())
          PY
          )"
          git init ../moenarch-foundation
          git -C ../moenarch-foundation fetch --depth=1 https://github.com/moritzbrantner/moenarch-foundation.git "$FOUNDATION_REV"
          git -C ../moenarch-foundation checkout --detach FETCH_HEAD

      - name: Refresh source-lock fingerprint deliberately
        shell: bash
        run: |
          set -euo pipefail
          cp Cargo.lock /tmp/registry-Cargo.lock
          bun ../coding-tooling/src/cli.ts source-deps activate --json
          cargo metadata --format-version 1 >/dev/null
          python3 - <<'PY'
          from hashlib import sha256
          from pathlib import Path
          Path('.coding-tooling.source-lock.sha256').write_text(
              f"{sha256(Path('Cargo.lock').read_bytes()).hexdigest()}\n"
          )
          PY
          bun ../coding-tooling/src/cli.ts source-deps deactivate --json
          cp /tmp/registry-Cargo.lock Cargo.lock
          git add .coding-tooling.source-lock.sha256 Cargo.lock
          git diff --cached --check
          git commit --amend --no-edit

      - name: Activate pinned source dependencies
        run: bash scripts/source-deps activate

      - name: Verify browser contract and existing surface
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p moenarch-audio-analysis-transcription-wasm --all-features
          bash scripts/check-wasm.sh
          cargo tree --locked --target wasm32-unknown-unknown \
            -p moenarch-audio-analysis-transcription-wasm \
            --no-default-features --features burn-webgpu \
            | tee /tmp/wasm-tree.txt
          ! grep -Eq '(^| )socks v|(^| )hf-hub v|(^| )ureq v|(^| )burn-(cuda|rocm|tch) v' /tmp/wasm-tree.txt

      - name: Deactivate source dependencies
        if: always()
        run: bash scripts/source-deps deactivate

      - name: Publish verified branch state
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/bootstrap-webgpu-lock.yml
          git add -A
          git diff --cached --check
          git commit -m "chore: remove WebGPU bootstrap workflow"
          git push origin HEAD:feat/webgpu-whisper-contract-refresh
