name: Bootstrap WebGPU Whisper contract

on:
  push:
    branches:
      - feat/webgpu-whisper-contract-refresh

permissions:
  contents: write

env:
  CODING_TOOLING_REV: c9e071995abf65d2326930efb05e47e585af0efd

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          fetch-depth: 0
          ref: feat/webgpu-whisper-contract-refresh

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.95.0
          targets: wasm32-unknown-unknown

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0

      - name: Transplant the current-safe Burn contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              if old not in text:
                  raise SystemExit(f"expected patch anchor missing in {path}: {old!r}")
              file.write_text(text.replace(old, new, 1))

          replace_once(
              "Cargo.toml",
              'tensor-data = { package = "moenarch-tensor-data", version = "=0.1.1" }\ncandle-core = "0.10.2"',
              'tensor-data = { package = "moenarch-tensor-data", version = "=0.1.1" }\n'
              'burn = { version = "0.21.0", default-features = false, features = ["std"] }\n'
              'burn-wgpu = { version = "0.21.0", default-features = false, features = ["std", "webgpu"] }\n'
              'candle-core = "0.10.2"',
          )

          replace_once(
              "crates/audio/audio-analysis-transcription/Cargo.toml",
              '\n[features]\ndefault = []\n',
              '\n[target.\'cfg(target_arch = "wasm32")\'.dependencies]\n'
              'burn = { workspace = true, optional = true }\n'
              'burn-wgpu = { workspace = true, optional = true }\n\n'
              '[features]\n'
              'default = []\n'
              'burn-webgpu = ["dep:burn", "dep:burn-wgpu"]\n',
          )

          replace_once(
              "crates/audio/audio-analysis-transcription/src/lib.rs",
              'mod bounded_window;\npub mod surface;',
              'mod bounded_window;\n#[cfg(feature = "burn-webgpu")]\npub mod burn_whisper_webgpu;\npub mod surface;',
          )

          replace_once(
              "crates/bindings/audio-analysis-transcription-wasm/Cargo.toml",
              'audio-analysis-transcription.workspace = true\n',
              'audio-analysis-transcription.workspace = true\n\n'
              '# Browser-only Burn/WebGPU plumbing is opt-in and never changes native Candle behavior.\n'
              '[target.\'cfg(target_arch = "wasm32")\'.dependencies]\n'
              'getrandom-02 = { package = "getrandom", version = "0.2.17", features = ["js"] }\n'
              'getrandom-04 = { package = "getrandom", version = "0.4.3", features = ["wasm_js"] }\n\n'
              '[features]\n'
              'default = []\n'
              'burn-webgpu = ["audio-analysis-transcription/burn-webgpu"]\n',
          )

          replace_once(
              "scripts/check-preflight.sh",
              'bash scripts/check-adapters.sh\ncargo doc',
              'bash scripts/check-adapters.sh\nbash scripts/check-wasm.sh\ncargo doc',
          )

          readme = Path("packages/audio-analysis-transcription-wasm/README.md")
          text = readme.read_text()
          anchor = 'browser and no server, Python, or CPU fallback is used.\n\n'
          note = (
              'browser and no server, Python, or CPU fallback is used.\n\n'
              '> The production browser executor currently remains the proven Transformers.js/WebGPU adapter. '
              'The Rust/Burn provider is being introduced behind an explicit `burn-webgpu` feature and reports '
              'itself as pending until real tiny/tiny.en inference is proven in-browser. There is no hidden fallback '
              'from that Rust provider contract.\n\n'
          )
          if anchor not in text:
              raise SystemExit("README browser-provider anchor missing")
          readme.write_text(text.replace(anchor, note, 1))
          PY

          git show origin/feat/webgpu-whisper-wasm:crates/audio/audio-analysis-transcription/src/burn_whisper_webgpu.rs \
            > crates/audio/audio-analysis-transcription/src/burn_whisper_webgpu.rs
          git show origin/feat/webgpu-whisper-wasm:crates/bindings/audio-analysis-transcription-wasm/src/lib.rs \
            > crates/bindings/audio-analysis-transcription-wasm/src/lib.rs
          git show origin/feat/webgpu-whisper-wasm:scripts/check-wasm.sh > scripts/check-wasm.sh
          chmod +x scripts/check-wasm.sh

      - name: Refresh lockfile
        run: cargo generate-lockfile

      - name: Format Rust
        run: cargo fmt --all

      - name: Checkpoint registry-profile changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock \
            crates/audio/audio-analysis-transcription/Cargo.toml \
            crates/audio/audio-analysis-transcription/src/lib.rs \
            crates/audio/audio-analysis-transcription/src/burn_whisper_webgpu.rs \
            crates/bindings/audio-analysis-transcription-wasm/Cargo.toml \
            crates/bindings/audio-analysis-transcription-wasm/src/lib.rs \
            packages/audio-analysis-transcription-wasm/README.md \
            scripts/check-wasm.sh scripts/check-preflight.sh
          git diff --cached --check
          git commit -m "chore: checkpoint WebGPU contract for source verification"

      - name: Prepare pinned source workspaces
        shell: bash
        run: |
          set -euo pipefail
          git init ../coding-tooling
          git -C ../coding-tooling fetch --depth=1 https://github.com/moritzbrantner/coding-tooling.git "$CODING_TOOLING_REV"
          git -C ../coding-tooling checkout --detach FETCH_HEAD
          (cd ../coding-tooling && bun install --frozen-lockfile)

          FOUNDATION_REV="$(python3 - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(Path('.coding-tooling.source-deps.json').read_text())
          revisions = {
              patch['rev']
              for patch in manifest['cargo']['patches']
              if patch['git'] == 'https://github.com/moritzbrantner/moenarch-foundation'
          }
          if len(revisions) != 1:
              raise SystemExit(f'expected one Foundation revision, found {sorted(revisions)}')
          print(revisions.pop())
          PY
          )"
          git init ../moenarch-foundation
          git -C ../moenarch-foundation fetch --depth=1 https://github.com/moritzbrantner/moenarch-foundation.git "$FOUNDATION_REV"
          git -C ../moenarch-foundation checkout --detach FETCH_HEAD

      - name: Refresh source lock baseline deliberately
        shell: bash
        run: |
          set -euo pipefail
          cp Cargo.lock /tmp/registry-Cargo.lock
          bun ../coding-tooling/src/cli.ts source-deps activate --json
          cargo metadata --format-version 1 >/dev/null
          python3 - <<'PY'
          from hashlib import sha256
          from pathlib import Path

          lock = Path("Cargo.lock").read_bytes()
          Path(".coding-tooling.source-lock.sha256").write_text(f"{sha256(lock).hexdigest()}\n")
          PY
          bun ../coding-tooling/src/cli.ts source-deps deactivate --json
          cp /tmp/registry-Cargo.lock Cargo.lock
          rm -f /tmp/registry-Cargo.lock
          git add .coding-tooling.source-lock.sha256 Cargo.lock
          git diff --cached --check
          git commit --amend --no-edit

      - name: Activate pinned source dependencies
        run: bash scripts/source-deps activate

      - name: Verify refreshed browser contract
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p moenarch-audio-analysis-transcription --features burn-webgpu
          bash scripts/check-wasm.sh
          cargo metadata --locked --format-version 1 --no-deps >/dev/null

      - name: Deactivate source dependencies
        if: always()
        run: bash scripts/source-deps deactivate

      - name: Publish clean product commit
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/bootstrap-webgpu-whisper-contract.yml
          git reset --soft origin/main
          git add -A
          git diff --cached --check
          git commit -m "feat: refresh Burn WebGPU transcription contract"
          git push --force-with-lease origin HEAD:feat/webgpu-whisper-contract-refresh
