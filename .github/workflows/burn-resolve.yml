name: Burn resolve

on:
  pull_request:

permissions:
  contents: write

jobs:
  resolve:
    if: github.head_ref == 'feat/webgpu-whisper-wasm'
    runs-on: ubuntu-latest
    steps:
      - name: Check out provider branch
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          ref: ${{ github.head_ref }}
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.95.0
          targets: wasm32-unknown-unknown
      - name: Wire provider and resolve lock
        run: |
          python3 - <<'PY'
          from pathlib import Path

          lib = Path('crates/audio/audio-analysis-transcription/src/lib.rs')
          text = lib.read_text()
          marker = 'mod bounded_window;\n'
          insertion = 'mod bounded_window;\n#[cfg(feature = "burn-webgpu")]\npub mod burn_whisper_webgpu;\n'
          if 'pub mod burn_whisper_webgpu;' not in text:
              if marker not in text:
                  raise SystemExit('could not find lib.rs module insertion point')
              text = text.replace(marker, insertion, 1)
              lib.write_text(text)

          provider = Path('crates/audio/audio-analysis-transcription/src/burn_whisper_webgpu.rs')
          text = provider.read_text()
          dead = '''        assets.config_json = assets\n            .config_json\n            .windows(3)\n            .fold(Vec::new(), |mut output, window| {\n                output.extend_from_slice(window);\n                output\n            });\n'''
          text = text.replace(dead, '')
          provider.write_text(text)
          PY

          cargo metadata --format-version 1 >/dev/null
          printf '%s\n' '3cd8067c24be0d3e41b0d5888f7eef88f3c73e9223286b98d41d83eec0fe04c4' > .coding-tooling.source-lock.sha256

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock .coding-tooling.source-lock.sha256 \
            crates/audio/audio-analysis-transcription/src/lib.rs \
            crates/audio/audio-analysis-transcription/src/burn_whisper_webgpu.rs
          if ! git diff --cached --quiet; then
            git commit -m "Wire Burn WebGPU provider into wasm gate"
            git push origin "HEAD:${GITHUB_HEAD_REF}"
          fi
      - name: Compile Burn WebGPU target
        run: |
          cargo check --locked \
            -p moenarch-audio-analysis-transcription-wasm \
            --target wasm32-unknown-unknown \
            --features burn-webgpu
