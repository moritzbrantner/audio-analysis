name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  CODING_TOOLING_REV: c9e071995abf65d2326930efb05e47e585af0efd

jobs:
  docs-scope:
    runs-on: ubuntu-latest
    outputs:
      docs-only: ${{ steps.classify.outputs.docs-only }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
      - id: classify
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          echo "docs-only=false" >> "$GITHUB_OUTPUT"
          if [[ "${{ github.event_name }}" != "pull_request" ]]; then exit 0; fi
          mapfile -d '' changed < <(git diff --no-renames --name-only -z "$BASE_SHA...$HEAD_SHA")
          if (( ${#changed[@]} == 0 )); then exit 0; fi
          for file in "${changed[@]}"; do
            if [[ "$file" != *.md ]]; then exit 0; fi
          done
          echo "docs-only=true" >> "$GITHUB_OUTPUT"

  verification:
    needs: docs-scope
    if: needs.docs-scope.outputs.docs-only != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.99.1
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - name: Prepare pinned source workspaces
        run: |
          git init ../coding-tooling
          git -C ../coding-tooling fetch --depth=1 https://github.com/moritzbrantner/coding-tooling.git "$CODING_TOOLING_REV"
          git -C ../coding-tooling checkout --detach FETCH_HEAD
          (cd ../coding-tooling && bun install --frozen-lockfile)

          FOUNDATION_REV="$(python3 - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(Path('.coding-tooling.source-deps.json').read_text())
          revisions = {
              patch['rev']
              for patch in manifest['cargo']['patches']
              if patch['git'] == 'https://github.com/moritzbrantner/moenarch-foundation'
          }
          if len(revisions) != 1:
              raise SystemExit(f'expected one Foundation revision, found {sorted(revisions)}')
          print(revisions.pop())
          PY
          )"
          git init ../moenarch-foundation
          git -C ../moenarch-foundation fetch --depth=1 https://github.com/moritzbrantner/moenarch-foundation.git "$FOUNDATION_REV"
          git -C ../moenarch-foundation checkout --detach FETCH_HEAD
      - name: Activate pinned source dependencies
        run: bash scripts/source-deps activate
      - name: Verify source-development workspace metadata
        run: cargo metadata --format-version 1 --no-deps > /dev/null
      - name: Run preflight
        run: scripts/check-preflight.sh
      - name: Diagnose exact source-development environment after CI failure
        if: ${{ failure() }}
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .artifacts/environment
          bun ../coding-tooling/src/cli.ts environment verify --profile source-development --json \
            > .artifacts/environment/ci.json
      - name: Upload failure environment diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: environment-failure-${{ github.sha }}
          path: .artifacts/environment/ci.json
          if-no-files-found: error
          retention-days: 7
      - name: Deactivate source dependencies
        if: always()
        run: bash scripts/source-deps deactivate

  structural-validation:
    needs: docs-scope
    if: needs.docs-scope.outputs.docs-only != 'true'
    uses: ./.github/workflows/structural-ci.yml

  runtime-validation:
    needs: docs-scope
    if: github.event_name == 'pull_request' && needs.docs-scope.outputs.docs-only != 'true'
    uses: ./.github/workflows/runtime-evidence.yml

  merge-ready:
    name: ${{ github.event_name == 'pull_request' && 'merge-ready' || 'validation-summary' }}
    if: ${{ always() }}
    needs: [docs-scope, verification, structural-validation, runtime-validation]
    runs-on: ubuntu-latest
    steps:
      - uses: moritzbrantner/reusable-workflows/.github/actions/merge-ready@b0f25f241d76af2584dfc9e375084ff5c5cb97da
        with:
          needs: ${{ toJSON(needs) }}
          required: '["docs-scope", "verification", "structural-validation", "runtime-validation"]'
          allow-skipped: ${{ needs.docs-scope.outputs.docs-only == 'true' && '["verification", "structural-validation", "runtime-validation"]' || github.event_name == 'pull_request' && '[]' || '["runtime-validation"]' }}
