name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CODING_TOOLING_REV: c9e071995abf65d2326930efb05e47e585af0efd

jobs:
  validation-scope:
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    outputs:
      validate-dj-generated-evidence: ${{ steps.scope.outputs.validate-dj-generated-evidence }}
      validate-dj-mixxx-benchmark: ${{ steps.scope.outputs.validate-dj-mixxx-benchmark }}
      validate-dj-real-music-evidence: ${{ steps.scope.outputs.validate-dj-real-music-evidence }}
      validate-environment-v1: ${{ steps.scope.outputs.validate-environment-v1 }}
      validate-pages: ${{ steps.scope.outputs.validate-pages }}
      validate-runtime-evidence: ${{ steps.scope.outputs.validate-runtime-evidence }}
      validate-structural-ci: ${{ steps.scope.outputs.validate-structural-ci }}
      allow-skipped: ${{ steps.scope.outputs.allow-skipped }}
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          fetch-depth: 0
      - id: scope
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          import fnmatch
          import json
          import os
          import subprocess
          scopes = {'validate-dj-generated-evidence': {'paths': ['.github/workflows/dj-generated-evidence.yml', 'crates/audio/audio-analysis-io/**', 'crates/audio/audio-analysis-pitch/**', 'crates/audio/audio-analysis-rhythm/**', 'scripts/evaluate-dj-generated-fixture.py', 'scripts/generate-dj-asset-tooling-fixture.mjs', 'tests/fixtures/dj/**', '.github/workflows/ci.yml'], 'branches': []}, 'validate-dj-mixxx-benchmark': {'paths': [], 'branches': [], 'label': 'dj-mixxx-benchmark'}, 'validate-dj-real-music-evidence': {'paths': [], 'branches': [], 'label': 'dj-real-music-evidence'}, 'validate-environment-v1': {'paths': ['.repository-environment.toml', 'scripts/codex-environment.sh', 'scripts/check-agent-readiness.sh', 'rust-toolchain.toml', 'Cargo.toml', 'Cargo.lock', 'crates/**/Cargo.toml', 'package.json', 'bun.lock', 'packages/**/package.json', '.github/workflows/environment-v1.yml', '.github/workflows/ci.yml'], 'branches': []}, 'validate-pages': {'paths': ['site/**', 'tests/pages/**', 'crates/audio/audio-analysis-core/**', 'crates/audio/audio-analysis-fourier/**', 'crates/audio/audio-analysis-pitch/**', 'crates/audio/audio-analysis-rhythm/**', 'crates/bindings/audio-analysis-core-wasm/**', 'crates/bindings/audio-analysis-fourier-wasm/**', 'crates/bindings/audio-analysis-pitch-wasm/**', 'crates/bindings/audio-analysis-rhythm-wasm/**', 'packages/audio-analysis-core-wasm/**', 'packages/audio-analysis-fourier-wasm/**', 'packages/audio-analysis-pitch-wasm/**', 'packages/audio-analysis-rhythm-wasm/**', 'scripts/build-pages.sh', 'scripts/check-pages.sh', 'scripts/check-pages-e2e.sh', 'scripts/check-pages-artifact.mjs', 'package.json', '.github/workflows/pages.yml', '.github/workflows/ci.yml'], 'branches': []}, 'validate-runtime-evidence': {'paths': [], 'branches': ['main']}, 'validate-structural-ci': {'paths': [], 'branches': []}}
          selected = {job: False for job in scopes}
          if os.environ["GITHUB_EVENT_NAME"] == "pull_request":
              with open(os.environ["GITHUB_EVENT_PATH"]) as source:
                  pull_request = json.load(source)["pull_request"]
              revision = pull_request["base"]["sha"] + "..." + pull_request["head"]["sha"]
              paths = subprocess.check_output(["git", "diff", "--no-renames", "--name-only", "-z", revision]).decode().split("\0")
              current = json.loads(subprocess.check_output([
                  "gh", "api", f"repos/{os.environ['GITHUB_REPOSITORY']}/pulls/{pull_request['number']}"
              ]))
              if current["head"]["sha"] != pull_request["head"]["sha"]:
                  raise RuntimeError("PR head changed; this validation scope is stale")
              labels = {label["name"].casefold() for label in current["labels"]}
              selected = {
                  job: (not rule["paths"] or any(fnmatch.fnmatchcase(path, pattern) for path in paths for pattern in rule["paths"]))
                  and (not rule["branches"] or any(fnmatch.fnmatchcase(pull_request["base"]["ref"], branch) for branch in rule["branches"]))
                  and (not rule.get("label") or rule["label"] in labels)
                  for job, rule in scopes.items()
              }
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              for job, active in selected.items():
                  print(f"{job}={str(active).lower()}", file=output)
              print(f"allow-skipped={json.dumps([job for job, active in selected.items() if not active])}", file=output)

  verification:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.95.0
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0
      - name: Prepare pinned source workspaces
        run: |
          git init ../coding-tooling
          git -C ../coding-tooling fetch --depth=1 https://github.com/moritzbrantner/coding-tooling.git "$CODING_TOOLING_REV"
          git -C ../coding-tooling checkout --detach FETCH_HEAD
          (cd ../coding-tooling && bun install --frozen-lockfile)

          FOUNDATION_REV="$(python3 - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(Path('.coding-tooling.source-deps.json').read_text())
          revisions = {
              patch['rev']
              for patch in manifest['cargo']['patches']
              if patch['git'] == 'https://github.com/moritzbrantner/moenarch-foundation'
          }
          if len(revisions) != 1:
              raise SystemExit(f'expected one Foundation revision, found {sorted(revisions)}')
          print(revisions.pop())
          PY
          )"
          git init ../moenarch-foundation
          git -C ../moenarch-foundation fetch --depth=1 https://github.com/moritzbrantner/moenarch-foundation.git "$FOUNDATION_REV"
          git -C ../moenarch-foundation checkout --detach FETCH_HEAD
      - name: Activate pinned source dependencies
        run: bash scripts/source-deps activate
      - name: Verify source-development workspace metadata
        run: cargo metadata --format-version 1 --no-deps > /dev/null
      - name: Run preflight
        run: scripts/check-preflight.sh
      - name: Diagnose exact source-development environment after CI failure
        if: ${{ failure() }}
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .artifacts/environment
          bun ../coding-tooling/src/cli.ts environment verify --profile source-development --json \
            > .artifacts/environment/ci.json
      - name: Upload failure environment diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: environment-failure-${{ github.sha }}
          path: .artifacts/environment/ci.json
          if-no-files-found: error
          retention-days: 7
      - name: Deactivate source dependencies
        if: always()
        run: bash scripts/source-deps deactivate

  validate-dj-generated-evidence:
    needs: validation-scope
    if: github.event_name == 'pull_request' && needs.validation-scope.outputs.validate-dj-generated-evidence == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/dj-generated-evidence.yml
    secrets: inherit

  validate-dj-mixxx-benchmark:
    needs: validation-scope
    if: github.event_name == 'pull_request' && needs.validation-scope.outputs.validate-dj-mixxx-benchmark == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/dj-mixxx-benchmark.yml
    secrets: inherit

  validate-dj-real-music-evidence:
    needs: validation-scope
    if: github.event_name == 'pull_request' && needs.validation-scope.outputs.validate-dj-real-music-evidence == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/dj-real-music-evidence.yml
    secrets: inherit

  validate-environment-v1:
    needs: validation-scope
    if: github.event_name == 'pull_request' && needs.validation-scope.outputs.validate-environment-v1 == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/environment-v1.yml
    secrets: inherit

  validate-pages:
    needs: validation-scope
    if: github.event_name == 'pull_request' && needs.validation-scope.outputs.validate-pages == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
    secrets: inherit

  validate-runtime-evidence:
    needs: validation-scope
    if: github.event_name == 'pull_request' && needs.validation-scope.outputs.validate-runtime-evidence == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/runtime-evidence.yml
    secrets: inherit

  validate-structural-ci:
    needs: validation-scope
    if: github.event_name == 'pull_request' && needs.validation-scope.outputs.validate-structural-ci == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/structural-ci.yml
    secrets: inherit

  merge-ready:
    name: ${{ github.event_name == 'pull_request' && 'merge-ready' || 'validation-summary' }}
    if: ${{ always() }}
    needs: ["verification", "validate-dj-generated-evidence", "validate-dj-mixxx-benchmark", "validate-dj-real-music-evidence", "validate-environment-v1", "validate-pages", "validate-runtime-evidence", "validate-structural-ci", "validation-scope"]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: moritzbrantner/reusable-workflows/.github/actions/merge-ready@b0f25f241d76af2584dfc9e375084ff5c5cb97da
        with:
          needs: ${{ toJSON(needs) }}
          required: '["verification", "validate-dj-generated-evidence", "validate-dj-mixxx-benchmark", "validate-dj-real-music-evidence", "validate-environment-v1", "validate-pages", "validate-runtime-evidence", "validate-structural-ci", "validation-scope"]'
          allow-skipped: ${{ needs.validation-scope.outputs.allow-skipped || '[]' }}
