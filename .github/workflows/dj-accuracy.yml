name: DJ accuracy evidence

on:
  pull_request:
    paths:
      - ".github/workflows/dj-accuracy.yml"
      - "scripts/dj_evaluation.py"
      - "scripts/evaluate-dj-goldens.py"
      - "scripts/test-dj-evaluation.py"
      - "crates/audio/audio-analysis-rhythm/**"
      - "crates/audio/audio-analysis-pitch/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  metric-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Test DJ accuracy metric contract
        run: python scripts/test-dj-evaluation.py

  real-music:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.95.0
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install reference analyzers
        run: >-
          python -m pip install --disable-pip-version-check
          "librosa==0.11.0"
          "essentia==2.1b6.dev1389"
      - name: Measure real-music DJ accuracy evidence
        run: >-
          python scripts/evaluate-dj-goldens.py
          --require-essentia
          --output target/dj-goldens/dj-accuracy.json
      - name: Upload DJ accuracy evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dj-accuracy-${{ github.sha }}
          path: target/dj-goldens/dj-accuracy.json
          if-no-files-found: warn
