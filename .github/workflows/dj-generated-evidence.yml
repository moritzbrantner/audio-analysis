name: DJ Generated Evidence

on:
  pull_request:
    paths:
      - ".github/workflows/dj-generated-evidence.yml"
      - "crates/audio/audio-analysis-io/**"
      - "crates/audio/audio-analysis-pitch/**"
      - "crates/audio/audio-analysis-rhythm/**"
      - "scripts/evaluate-dj-generated-fixture.py"
      - "scripts/generate-dj-asset-tooling-fixture.mjs"
      - "tests/fixtures/dj/**"
  workflow_dispatch:

permissions:
  contents: read

env:
  ASSET_TOOLING_REV: 7b8bd27f002ccc8470afedb0e93bb1086901b1ca

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out audio-analysis
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.95.0
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0
      - name: Install FFmpeg runtime
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
      - name: Probe Wikimedia corpus candidates
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import pathlib
          import time
          import urllib.error
          import urllib.request

          candidates = [
              (
                  "Mini_light_trance_mix_by_Dream_Vilanculos.ogg",
                  "https://upload.wikimedia.org/wikipedia/commons/b/bb/Mini_light_trance_mix_by_Dream_Vilanculos.ogg",
                  1334641,
                  "58ea22d3e0e13015f9728da7bd6a840543bd2df4",
              ),
              (
                  "Wikipedia_guitar_solo.ogg",
                  "https://upload.wikimedia.org/wikipedia/commons/b/b6/Wikipedia_guitar_solo.ogg",
                  558882,
                  "1a97d0ee955dbb2173a781c67b2e301e05daf5d7",
              ),
          ]
          root = pathlib.Path("target/dj-goldens/wikimedia-probe")
          root.mkdir(parents=True, exist_ok=True)
          for candidate_index, (filename, url, expected_bytes, expected_sha1) in enumerate(candidates):
              target = root / filename
              for attempt in range(5):
                  try:
                      request = urllib.request.Request(
                          url,
                          headers={
                              "User-Agent": "audio-analysis-dj-corpus/1.0 (+https://github.com/moritzbrantner/audio-analysis)"
                          },
                      )
                      with urllib.request.urlopen(request, timeout=120) as response, target.open("wb") as stream:
                          while chunk := response.read(1024 * 1024):
                              stream.write(chunk)
                      break
                  except urllib.error.HTTPError as error:
                      if error.code != 429 or attempt == 4:
                          raise
                      target.unlink(missing_ok=True)
                      time.sleep(3 * (attempt + 1))
              payload = target.read_bytes()
              actual = {
                  "filename": filename,
                  "bytes": len(payload),
                  "sha1": hashlib.sha1(payload).hexdigest(),
                  "sha256": hashlib.sha256(payload).hexdigest(),
              }
              print("WIKIMEDIA_PROBE " + json.dumps(actual, sort_keys=True))
              if actual["bytes"] != expected_bytes or actual["sha1"] != expected_sha1:
                  raise SystemExit(f"published Wikimedia identity mismatch for {filename}: {actual}")
              if candidate_index + 1 < len(candidates):
                  time.sleep(3)
          PY
      - name: Prepare pinned asset-tooling source
        run: |
          git init ../asset-tooling
          git -C ../asset-tooling fetch --depth=1 https://github.com/moritzbrantner/asset-tooling.git "$ASSET_TOOLING_REV"
          git -C ../asset-tooling checkout --detach FETCH_HEAD
      - name: Evaluate authored DJ fixture
        run: >-
          python3 scripts/evaluate-dj-generated-fixture.py
          --asset-tooling ../asset-tooling
          --report target/dj-goldens/generated/report.json
      - name: Probe Beethoven modulation evidence
        run: |
          mkdir -p target/dj-goldens/modulation
          python3 - <<'PY'
          import hashlib
          import json
          import pathlib
          import urllib.request

          manifest = json.loads(pathlib.Path("tests/fixtures/dj/real-music-corpus.v1.json").read_text())
          fixture = next(
              item
              for item in manifest["fixtures"]
              if item["name"] == "beethoven-pathetique-adagio-modulation"
          )
          target = pathlib.Path("target/dj-goldens/modulation") / fixture["filename"]
          request = urllib.request.Request(
              fixture["sourceUrl"],
              headers={"User-Agent": "audio-analysis-dj-corpus/1.0"},
          )
          with urllib.request.urlopen(request, timeout=120) as response, target.open("wb") as stream:
              while chunk := response.read(1024 * 1024):
                  stream.write(chunk)
          digest = hashlib.sha256(target.read_bytes()).hexdigest()
          if digest != fixture["sha256"]:
              raise SystemExit(f"SHA-256 mismatch: {digest}")
          PY
          cargo run --locked --quiet -p moenarch-audio-analysis-rhythm --example dj_analyze -- \
            target/dj-goldens/modulation/Beethoven_Pathetique_Adagio_cantabile.ogg \
            > target/dj-goldens/modulation/beethoven-analysis.json
      - name: Diagnose Rust analyzer failure
        if: failure()
        run: >-
          cargo run --locked
          -p moenarch-audio-analysis-rhythm
          --example dj_analyze
          -- target/dj-goldens/generated/asset-tooling-half-time-song-a.wav
      - name: Upload generated DJ evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dj-generated-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            target/dj-goldens/generated/report.json
            target/dj-goldens/generated/asset-tooling-half-time-song-a.wav
            target/dj-goldens/generated/asset-tooling-half-time-song-a.json
            target/dj-goldens/generated/asset-tooling-half-time-song-b.json
            target/dj-goldens/modulation/beethoven-analysis.json
          if-no-files-found: error
