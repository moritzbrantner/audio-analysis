name: DJ style helper

on:
  push:
    branches:
      - feature/dj-rhythm-key-analysis

permissions:
  contents: write

jobs:
  style:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/dj-rhythm-key-analysis
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Repair Clippy finding
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('crates/audio/audio-analysis-pitch/src/key.rs')
          source = path.read_text()
          pattern = re.compile(
              r'(?m)^    for pitch_class in 0\.\.12 \{\n'
              r'        let x = chroma\[pitch_class\] - chroma_mean;\n'
              r'        let relative = \(pitch_class \+ 12 - tonic\) % 12;\n'
          )
          replacement = (
              '    for (pitch_class, chroma_value) in chroma.iter().enumerate() {\n'
              '        let x = *chroma_value - chroma_mean;\n'
              '        let relative = (pitch_class + 12 - tonic) % 12;\n'
          )
          updated, count = pattern.subn(replacement, source, count=1)
          if count != 1:
              raise SystemExit(f'expected exactly one needless-range-loop block, found {count}')
          path.write_text(updated)
          PY
      - name: Format modified capability crates
        run: cargo fmt -p moenarch-audio-analysis-rhythm -p moenarch-audio-analysis-pitch
      - name: Check modified capability crates
        run: cargo clippy -p moenarch-audio-analysis-rhythm -p moenarch-audio-analysis-pitch --all-targets -- -D warnings
      - name: Commit focused repair
        run: |
          git add crates/audio/audio-analysis-rhythm crates/audio/audio-analysis-pitch
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Repair DJ analysis Clippy finding"
          git push origin HEAD:feature/dj-rhythm-key-analysis
