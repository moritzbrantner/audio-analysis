name: DJ style helper

on:
  push:
    branches:
      - feature/dj-rhythm-key-analysis

permissions:
  contents: write

jobs:
  style:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/dj-rhythm-key-analysis
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Repair Clippy finding
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('crates/audio/audio-analysis-pitch/src/key.rs')
          source = path.read_text()
          old = '''    for pitch_class in 0..12 {
              let x = chroma[pitch_class] - chroma_mean;
              let relative = (pitch_class + 12 - tonic) % 12;
          '''
          if old not in source:
              old = '''    for pitch_class in 0..12 {
              let x = chroma[pitch_class] - chroma_mean;
              let relative = (pitch_class + 12 - tonic) % 12;
          '''.replace('          ', '        ')
          new = '''    for (pitch_class, chroma_value) in chroma.iter().enumerate() {
              let x = *chroma_value - chroma_mean;
              let relative = (pitch_class + 12 - tonic) % 12;
          '''
          if old not in source:
              raise SystemExit('expected needless-range-loop block not found')
          path.write_text(source.replace(old, new, 1))
          PY
      - name: Format modified capability crates
        run: cargo fmt -p moenarch-audio-analysis-rhythm -p moenarch-audio-analysis-pitch
      - name: Check modified capability crates
        run: cargo clippy -p moenarch-audio-analysis-rhythm -p moenarch-audio-analysis-pitch --all-targets -- -D warnings
      - name: Commit focused repair
        run: |
          git add crates/audio/audio-analysis-rhythm crates/audio/audio-analysis-pitch
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Repair DJ analysis Clippy finding"
          git push origin HEAD:feature/dj-rhythm-key-analysis
