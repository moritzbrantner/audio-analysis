name: DJ style helper

on:
  push:
    branches:
      - feature/dj-rhythm-key-analysis

permissions:
  contents: read

jobs:
  style:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check modified capability crates
        run: cargo clippy -p moenarch-audio-analysis-rhythm -p moenarch-audio-analysis-pitch --all-targets -- -D warnings
