name: DJ Mixxx Benchmark

on:
  pull_request:
    types: [labeled, synchronize]
  workflow_dispatch:
    inputs:
      fixture:
        description: Optional corpus fixture for focused diagnosis (authored cases remain included)
        required: false
        type: string

permissions:
  contents: read

env:
  CODING_TOOLING_REV: c9e071995abf65d2326930efb05e47e585af0efd

jobs:
  benchmark:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'dj-mixxx-benchmark')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy, rustfmt
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest
      - name: Prepare exact source dependencies
        run: |
          git init ../coding-tooling
          git -C ../coding-tooling fetch --depth=1 https://github.com/moritzbrantner/coding-tooling.git "$CODING_TOOLING_REV"
          git -C ../coding-tooling checkout --detach FETCH_HEAD
          (cd ../coding-tooling && bun install --frozen-lockfile)
          FOUNDATION_REV="$(python3 - <<'PY'
          import json
          from pathlib import Path
          patches = json.loads(Path('.coding-tooling.source-deps.json').read_text())['cargo']['patches']
          revisions = {patch['rev'] for patch in patches}
          if len(revisions) != 1:
              raise SystemExit('expected one exact Foundation source revision')
          print(revisions.pop())
          PY
          )"
          git init ../moenarch-foundation
          git -C ../moenarch-foundation fetch --depth=1 https://github.com/moritzbrantner/moenarch-foundation.git "$FOUNDATION_REV"
          git -C ../moenarch-foundation checkout --detach FETCH_HEAD
          bash scripts/source-deps activate
      - name: Install and verify Rust audio decoder tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
          ffprobe -version
          ffmpeg -version
      - name: Validate offline benchmark contracts
        run: |
          python3 -m unittest discover -s tests/dj -p 'test_*.py'
          python3 scripts/evaluate-dj-mixxx.py --check-manifest
      - name: Build pinned Mixxx evaluation runtime
        run: docker build --tag audio-analysis-mixxx:2.5.4 scripts/mixxx
      - name: Capture and compare whole-track analysis
        env:
          DJ_FIXTURE: ${{ inputs.fixture }}
        run: |
          args=()
          if test -n "$DJ_FIXTURE"; then
            args+=(--fixture "$DJ_FIXTURE")
          fi
          python3 scripts/evaluate-dj-mixxx.py "${args[@]}"
          cat target/dj-goldens/mixxx/report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload comparison and repeated reference captures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dj-mixxx-benchmark-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            target/dj-goldens/mixxx/report.json
            target/dj-goldens/mixxx/report.md
            target/dj-goldens/mixxx/capture-*/capture.json
            target/dj-goldens/mixxx/capture-*/job.json
            target/dj-goldens/mixxx/capture-*/*/process.log
          if-no-files-found: error
      - name: Restore registry lock
        if: always()
        run: bash scripts/source-deps deactivate
