name: DJ Real Music Evidence

on:
  pull_request:
    types: [labeled, synchronize]
  workflow_dispatch:
    inputs:
      fixture:
        description: Optional single fixture name for focused diagnosis
        required: false
        type: string

permissions:
  contents: read

jobs:
  evidence:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'dj-real-music-evidence')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out audio-analysis
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.95.0
      - name: Install FFmpeg runtime
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
          ffmpeg -version | head -n 1
      - name: Validate corpus manifest
        run: python3 scripts/evaluate-dj-goldens.py --check-manifest
      - name: Install pinned reference analyzers
        run: >-
          python3 -m pip install --disable-pip-version-check
          librosa==1.0.0
          essentia==2.1b6.dev1389
      - name: Evaluate real-music DJ corpus
        env:
          DJ_FIXTURE: ${{ inputs.fixture }}
        run: |
          mkdir -p target/dj-goldens/real-music
          args=()
          if test -n "$DJ_FIXTURE"; then
            args+=(--fixture "$DJ_FIXTURE")
          fi
          python3 scripts/evaluate-dj-goldens.py "${args[@]}" > target/dj-goldens/real-music/report.json
      - name: Summarize failed evidence
        if: failure()
        run: |
          if test -s target/dj-goldens/real-music/report.json; then
            python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path("target/dj-goldens/real-music/report.json")
          try:
              report = json.loads(path.read_text())
          except json.JSONDecodeError as error:
              print(f"real-music report is not valid JSON: {error}")
          else:
              print(json.dumps({
                  "aggregate": report.get("aggregate"),
                  "failures": report.get("failures"),
              }, indent=2))
          PY
          else
            echo "No completed real-music JSON report was produced; inspect evaluator stderr above."
          fi
      - name: Upload real-music DJ evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dj-real-music-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          path: target/dj-goldens/real-music/report.json
          if-no-files-found: error
