name: Generate Tauri tuner lock

on:
  push:
    branches:
      - chore/generate-tauri-tuner-lock
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-22.04
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.98.0

      - name: Generate exact Cargo lock
        run: cargo generate-lockfile --manifest-path .tmp/tauri-guitar-tuner/Cargo.toml

      - name: Commit generated lock
        run: |
          if git diff --quiet -- .tmp/tauri-guitar-tuner/Cargo.lock && git ls-files --error-unmatch .tmp/tauri-guitar-tuner/Cargo.lock >/dev/null 2>&1; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .tmp/tauri-guitar-tuner/Cargo.lock
          git commit -m "Generate Tauri guitar tuner Cargo lock"
          git push
