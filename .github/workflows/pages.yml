name: GitHub Pages

on:
  pull_request:
    paths:
      - "site/**"
      - "crates/audio/audio-analysis-core/**"
      - "crates/audio/audio-analysis-fourier/**"
      - "crates/audio/audio-analysis-pitch/**"
      - "crates/audio/audio-analysis-rhythm/**"
      - "crates/bindings/audio-analysis-core-wasm/**"
      - "crates/bindings/audio-analysis-fourier-wasm/**"
      - "crates/bindings/audio-analysis-pitch-wasm/**"
      - "crates/bindings/audio-analysis-rhythm-wasm/**"
      - "packages/audio-analysis-core-wasm/**"
      - "packages/audio-analysis-fourier-wasm/**"
      - "packages/audio-analysis-pitch-wasm/**"
      - "packages/audio-analysis-rhythm-wasm/**"
      - "scripts/build-pages.sh"
      - ".github/workflows/pages.yml"
  push:
    branches: [main]
    paths:
      - "site/**"
      - "crates/audio/audio-analysis-core/**"
      - "crates/audio/audio-analysis-fourier/**"
      - "crates/audio/audio-analysis-pitch/**"
      - "crates/audio/audio-analysis-rhythm/**"
      - "crates/bindings/audio-analysis-core-wasm/**"
      - "crates/bindings/audio-analysis-fourier-wasm/**"
      - "crates/bindings/audio-analysis-pitch-wasm/**"
      - "crates/bindings/audio-analysis-rhythm-wasm/**"
      - "packages/audio-analysis-core-wasm/**"
      - "packages/audio-analysis-fourier-wasm/**"
      - "packages/audio-analysis-pitch-wasm/**"
      - "packages/audio-analysis-rhythm-wasm/**"
      - "scripts/build-pages.sh"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.95.0
          targets: wasm32-unknown-unknown

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0

      - name: Install workspace dependencies
        run: bun install --frozen-lockfile

      - name: Install wasm-pack
        run: cargo install wasm-pack --version 0.13.1 --locked

      - name: Build Audio Inspector Pages artifact
        run: bash scripts/build-pages.sh

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
