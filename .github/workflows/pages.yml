name: GitHub Pages

on:
  pull_request:
    paths:
      - "site/**"
      - "tests/pages/**"
      - "crates/audio/audio-analysis-core/**"
      - "crates/audio/audio-analysis-fourier/**"
      - "crates/audio/audio-analysis-pitch/**"
      - "crates/audio/audio-analysis-rhythm/**"
      - "crates/bindings/audio-analysis-core-wasm/**"
      - "crates/bindings/audio-analysis-fourier-wasm/**"
      - "crates/bindings/audio-analysis-pitch-wasm/**"
      - "crates/bindings/audio-analysis-rhythm-wasm/**"
      - "packages/audio-analysis-core-wasm/**"
      - "packages/audio-analysis-fourier-wasm/**"
      - "packages/audio-analysis-pitch-wasm/**"
      - "packages/audio-analysis-rhythm-wasm/**"
      - "scripts/build-pages.sh"
      - "scripts/check-pages.sh"
      - "scripts/check-pages-e2e.sh"
      - "scripts/check-pages-artifact.mjs"
      - "package.json"
      - ".github/workflows/pages.yml"
  push:
    branches: [main]
    paths:
      - "site/**"
      - "tests/pages/**"
      - "crates/audio/audio-analysis-core/**"
      - "crates/audio/audio-analysis-fourier/**"
      - "crates/audio/audio-analysis-pitch/**"
      - "crates/audio/audio-analysis-rhythm/**"
      - "crates/bindings/audio-analysis-core-wasm/**"
      - "crates/bindings/audio-analysis-fourier-wasm/**"
      - "crates/bindings/audio-analysis-pitch-wasm/**"
      - "crates/bindings/audio-analysis-rhythm-wasm/**"
      - "packages/audio-analysis-core-wasm/**"
      - "packages/audio-analysis-fourier-wasm/**"
      - "packages/audio-analysis-pitch-wasm/**"
      - "packages/audio-analysis-rhythm-wasm/**"
      - "scripts/build-pages.sh"
      - "scripts/check-pages.sh"
      - "scripts/check-pages-e2e.sh"
      - "scripts/check-pages-artifact.mjs"
      - "package.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.99.1
          targets: wasm32-unknown-unknown

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3

      - name: Install workspace dependencies
        run: bun install --frozen-lockfile

      - name: Install wasm-pack
        run: cargo install wasm-pack --version 0.13.1 --locked

      - name: Verify Audio Inspector Pages artifact
        run: bun run check:pages

      - name: Run Audio Inspector real-browser smoke test
        run: bun run test:pages:e2e

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
