name: PR 93 refresh lock

on:
  push:
    branches:
      - feature/karaoke-chart-export

permissions:
  contents: write

jobs:
  refresh-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/karaoke-chart-export
      - name: Reconcile Cargo.lock from the existing resolution
        run: cargo metadata --format-version 1 >/dev/null
      - name: Commit only the lockfile
        run: |
          if git diff --quiet -- Cargo.lock; then
            echo 'Cargo.lock did not need an update' >&2
            exit 1
          fi
          git diff --exit-code -- . ':(exclude)Cargo.lock'
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Cargo.lock
          git commit -m 'Reconcile karaoke Cargo lock'
          git push origin HEAD:feature/karaoke-chart-export
