name: Repair truncated TTS test module

on:
  push:
    branches:
      - ci/strengthen-fast-checks
    paths:
      - .github/workflows/repair-truncated-tts-test.yml

permissions:
  contents: write

jobs:
  restore-test-tail:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v6
        with:
          ref: ci/strengthen-fast-checks
          fetch-depth: 0
      - name: Restore accidentally deleted test tail
        shell: bash
        run: |
          file='crates/audio/audio-generation-tts/src/surface.rs'
          git checkout d52ef0afce9d417c29cd61eddb552723c5a9f504 -- "$file"
          python3 - <<'PY'
          from pathlib import Path
          path = Path('crates/audio/audio-generation-tts/src/surface.rs')
          text = path.read_text()
          old = '        audio_analysis_transcription::TranscriptionSource::Path { .. } => "path",\n'
          new = old + '        audio_analysis_transcription::TranscriptionSource::Media { .. } => "media",\n'
          if new not in text:
              if old not in text:
                  raise SystemExit('expected transcription source match arm not found')
              text = text.replace(old, new, 1)
              path.write_text(text)
          PY
          git diff --check -- "$file"
          test "$(git diff --numstat d52ef0afce9d417c29cd61eddb552723c5a9f504 -- "$file" | awk '{print $1 ":" $2}')" = '1:0'
      - name: Commit narrow restoration
        shell: bash
        run: |
          file='crates/audio/audio-generation-tts/src/surface.rs'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$file"
          git commit -m 'fix: restore truncated TTS tests'
          git push origin HEAD:ci/strengthen-fast-checks
