name: Structural CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  extraction-structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: oven-sh/setup-bun@v2
      - run: bun run check:structure
      - run: cargo metadata --format-version 1 --no-deps
