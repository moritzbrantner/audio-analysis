name: Structural CI

on:
  workflow_call:

permissions:
  contents: read

jobs:
  extraction-structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest
      - run: bun test scripts/prepare-pyannote-community-bundle.test.ts
      - run: bun run check:structure
      - run: bun run check:dj-corpus
      - run: cargo metadata --locked --format-version 1 --no-deps
