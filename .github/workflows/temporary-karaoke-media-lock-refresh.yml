name: Temporary karaoke media lock refresh

on:
  push:
    branches: [codex/singstar-media-input]

permissions:
  contents: write

env:
  CODING_TOOLING_REV: c9e071995abf65d2326930efb05e47e585af0efd

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          ref: codex/singstar-media-input
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.95.0
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0
      - name: Prepare pinned source workspaces
        run: |
          git init ../coding-tooling
          git -C ../coding-tooling fetch --depth=1 https://github.com/moritzbrantner/coding-tooling.git "$CODING_TOOLING_REV"
          git -C ../coding-tooling checkout --detach FETCH_HEAD
          (cd ../coding-tooling && bun install --frozen-lockfile)

          FOUNDATION_REV="$(python3 - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(Path('.coding-tooling.source-deps.json').read_text())
          revisions = {
              patch['rev']
              for patch in manifest['cargo']['patches']
              if patch['git'] == 'https://github.com/moritzbrantner/moenarch-foundation'
          }
          if len(revisions) != 1:
              raise SystemExit(f'expected one Foundation revision, found {sorted(revisions)}')
          print(revisions.pop())
          PY
          )"
          git init ../moenarch-foundation
          git -C ../moenarch-foundation fetch --depth=1 https://github.com/moritzbrantner/moenarch-foundation.git "$FOUNDATION_REV"
          git -C ../moenarch-foundation checkout --detach FETCH_HEAD
      - name: Reconcile registry and source locks
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          cargo metadata --format-version 1 >/dev/null
          if ! git diff --quiet -- Cargo.lock; then
            git add Cargo.lock
            git commit -m 'chore: reconcile karaoke media registry Cargo lock'
          fi

          set +e
          activation_output="$(bash scripts/source-deps activate 2>&1)"
          activation_status=$?
          set -e
          printf '%s\n' "$activation_output"

          if [[ $activation_status -ne 0 ]]; then
            actual="$(printf '%s\n' "$activation_output" | sed -n 's/^actual:[[:space:]]*//p' | tail -n 1)"
            if [[ -z "$actual" ]]; then
              printf '%s\n' 'source activation failed without a fingerprint mismatch' >&2
              exit "$activation_status"
            fi
            printf '%s\n' "$actual" > .coding-tooling.source-lock.sha256
          else
            bash scripts/source-deps deactivate
          fi

          bash scripts/source-deps activate
          bash scripts/source-deps deactivate
          cargo metadata --locked --format-version 1 >/dev/null

          if ! git diff --quiet -- .coding-tooling.source-lock.sha256; then
            git add .coding-tooling.source-lock.sha256
            git commit -m 'chore: refresh karaoke media source lock fingerprint'
          fi

          git push origin HEAD:codex/singstar-media-input
