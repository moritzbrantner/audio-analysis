name: Temporary karaoke separation module

on:
  push:
    branches: [codex/singstar-vocal-separation]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          ref: codex/singstar-vocal-separation
      - name: Register separation module
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('crates/audio/audio-karaoke-pipeline/src/lib.rs')
          text = path.read_text()
          old = '''#[cfg(feature = "audio-io")]
pub mod media;
'''
          new = '''#[cfg(feature = "audio-io")]
pub mod media;
#[cfg(feature = "separation")]
pub mod separation;
'''
          if old not in text:
              raise SystemExit('expected media module marker not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/audio/audio-karaoke-pipeline/src/lib.rs
          git commit -m 'feat(karaoke): expose vocal separation adapter'
          git push origin HEAD:codex/singstar-vocal-separation
