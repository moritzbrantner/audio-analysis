name: Wikimedia Corpus Probe

on:
  pull_request:
    paths:
      - ".github/workflows/wikimedia-corpus-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - name: Hash remaining Wikimedia candidates
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import pathlib
          import time
          import urllib.error
          import urllib.request

          candidates = [
              (
                  "Mini_light_trance_mix_by_Dream_Vilanculos.ogg",
                  "https://upload.wikimedia.org/wikipedia/commons/b/bb/Mini_light_trance_mix_by_Dream_Vilanculos.ogg",
                  1334641,
                  "58ea22d3e0e13015f9728da7bd6a840543bd2df4",
              ),
              (
                  "Wikipedia_guitar_solo.ogg",
                  "https://upload.wikimedia.org/wikipedia/commons/b/b6/Wikipedia_guitar_solo.ogg",
                  558882,
                  "1a97d0ee955dbb2173a781c67b2e301e05daf5d7",
              ),
          ]
          for index, (filename, url, expected_bytes, expected_sha1) in enumerate(candidates):
              target = pathlib.Path(filename)
              for attempt in range(6):
                  try:
                      req = urllib.request.Request(
                          url,
                          headers={"User-Agent": "audio-analysis-dj-corpus/1.0 (+https://github.com/moritzbrantner/audio-analysis)"},
                      )
                      with urllib.request.urlopen(req, timeout=120) as response, target.open("wb") as stream:
                          while chunk := response.read(1024 * 1024):
                              stream.write(chunk)
                      break
                  except urllib.error.HTTPError as error:
                      if error.code != 429 or attempt == 5:
                          raise
                      target.unlink(missing_ok=True)
                      time.sleep(4 * (attempt + 1))
              payload = target.read_bytes()
              actual = {
                  "filename": filename,
                  "bytes": len(payload),
                  "sha1": hashlib.sha1(payload).hexdigest(),
                  "sha256": hashlib.sha256(payload).hexdigest(),
              }
              print("WIKIMEDIA_PROBE " + json.dumps(actual, sort_keys=True))
              if actual["bytes"] != expected_bytes or actual["sha1"] != expected_sha1:
                  raise SystemExit(f"published Wikimedia identity mismatch for {filename}: {actual}")
              if index + 1 < len(candidates):
                  time.sleep(4)
          PY
