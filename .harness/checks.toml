independence_group = "cargo-metadata"

[[checks]]
id = "workspace-preflight"
command = ["scripts/check-preflight.sh"]
scope = ["Cargo.toml", "Cargo.lock", "crates/**", "packages/**", "docs/**", ".github/**"]
tier = "full"
blocking = true
evidence_classes = ["behavioral", "integration"]
protected_properties = ["INV-001"]
source_of_truth = "issue:#115"
state_class = "deterministic"
timeout_seconds = 3600
tools = ["cargo", "bun"]
services = []
