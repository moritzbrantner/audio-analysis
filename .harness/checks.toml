[[checks]]
id = "workspace-metadata"
command = ["cargo", "metadata", "--format-version", "1", "--no-deps"]
scope = ["Cargo.toml", "Cargo.lock", "crates/**"]
tier = "targeted"
blocking = true
evidence_classes = ["static", "contract"]
protected_properties = ["INV-001"]
source_of_truth = "issue:#115"
state_class = "deterministic"
timeout_seconds = 60
tools = ["cargo"]
services = []
generated_outputs = []
cost_class = "low"
success_exit_codes = [0]
