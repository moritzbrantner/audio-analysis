[workspace]
resolver = "2"
members = [
  "crates/audio/*",
  "crates/bindings/*",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.95"
repository = "https://github.com/moritzbrantner/audio-analysis"
homepage = "https://github.com/moritzbrantner/audio-analysis"
documentation = "https://docs.rs/moenarch-audio-analysis-core"
keywords = ["audio", "multimedia", "analysis", "signal"]
categories = ["multimedia", "science", "algorithms"]

[workspace.dependencies]
# Destination-owned crates retain path-plus-version coordinates for packaging.
audio-analysis-core = { package = "moenarch-audio-analysis-core", version = "=0.1.1", path = "crates/audio/audio-analysis-core" }
audio-analysis-fourier = { package = "moenarch-audio-analysis-fourier", version = "=0.1.1", path = "crates/audio/audio-analysis-fourier" }
audio-analysis-io = { package = "moenarch-audio-analysis-io", version = "=0.1.2", path = "crates/audio/audio-analysis-io" }
audio-analysis-pitch = { package = "moenarch-audio-analysis-pitch", version = "0.1.0", path = "crates/audio/audio-analysis-pitch" }
audio-analysis-processing = { package = "moenarch-audio-analysis-processing", version = "0.1.0", path = "crates/audio/audio-analysis-processing" }
audio-analysis-recognition = { package = "moenarch-audio-analysis-recognition", version = "=0.1.1", path = "crates/audio/audio-analysis-recognition" }
audio-analysis-rhythm = { package = "moenarch-audio-analysis-rhythm", version = "0.1.0", path = "crates/audio/audio-analysis-rhythm" }
audio-analysis-separation = { package = "moenarch-audio-analysis-separation", version = "0.1.0", path = "crates/audio/audio-analysis-separation" }
audio-analysis-speakers = { package = "moenarch-audio-analysis-speakers", version = "=0.1.5", path = "crates/audio/audio-analysis-speakers" }
audio-analysis-synthesis = { package = "moenarch-audio-analysis-synthesis", version = "0.1.0", path = "crates/audio/audio-analysis-synthesis" }
audio-analysis-transcription = { package = "moenarch-audio-analysis-transcription", version = "=0.1.16", path = "crates/audio/audio-analysis-transcription" }
audio-generation-midi = { package = "moenarch-audio-generation-midi", version = "0.1.0", path = "crates/audio/audio-generation-midi" }
audio-generation-tts = { package = "moenarch-audio-generation-tts", version = "0.1.0", path = "crates/audio/audio-generation-tts" }

# External capability contracts are registry-only and exact.
audio-contracts = { package = "moenarch-audio-contracts", version = "=0.1.0" }
data-inversion-core = { package = "moenarch-data-inversion-core", version = "=0.1.1" }
jobs-core = { package = "moenarch-jobs-core", version = "=0.1.2" }
math-signal-core = { package = "moenarch-math-signal-core", version = "=0.1.1" }
media-core = { package = "moenarch-media-core", version = "=0.1.0" }
model-runtime = { package = "moenarch-model-runtime", version = "=0.1.1" }
runtime-core = { package = "moenarch-runtime-core", version = "=0.2.1" }
runtime-onnx = { package = "moenarch-runtime-onnx", version = "=0.1.1" }
tensor-data = { package = "moenarch-tensor-data", version = "=0.1.1" }
text-model-runtime = { package = "moenarch-text-model-runtime", version = "=0.1.1" }
text-transcripts = { package = "moenarch-text-transcripts", version = "=0.1.3" }

candle-core = "0.10.2"
candle-nn = "0.10.2"
candle-transformers = "0.10.2"
clap = { version = "4.5.51", features = ["derive"] }
criterion = "0.5.1"
flate2 = "1.1.9"
hound = "3.5.1"
ndarray = "0.17.2"
proptest = "1.6.0"
rayon = "1.11.0"
rustfft = "6.2.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.10.9"
tempfile = "3.23.0"
thiserror = "2.0.17"
tokenizers = { version = "0.22.2", default-features = false, features = ["unstable_wasm"] }
