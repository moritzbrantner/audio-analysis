[package]
name = "moenarch-audio-analysis-speakers"
version = "0.1.4"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Speaker embeddings, enrollment, identification, VAD, and diarization APIs for video-analysis."
readme = "README.md"
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
name = "audio_analysis_speakers"

[dependencies]
runtime-core.workspace = true
audio-analysis-core.workspace = true
audio-analysis-recognition.workspace = true
model-runtime = { workspace = true, optional = true }
runtime-onnx = { workspace = true, optional = true }
ndarray = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
audio-contracts.workspace = true

[features]
default = []
onnx = ["dep:runtime-onnx", "runtime-onnx/onnxruntime"]
pyannote-diarization = ["onnx", "dep:ndarray", "dep:sha2"]
model-bundles = ["dep:model-runtime"]
external-tests = ["onnx", "model-bundles"]

[dev-dependencies]
hound.workspace = true
