[package]
name = "moenarch-audio-analysis-transcription-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "WASM bindings for audio-analysis-transcription."
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
runtime-core.workspace = true
js-sys = "0.3.82"
serde.workspace = true
serde_json.workspace = true
serde-wasm-bindgen = "0.6.5"
wasm-bindgen = "0.2.105"
audio-analysis-transcription.workspace = true

# The browser adapter already requires wasm-bindgen/js-sys. Enabling getrandom's
# JS backend here is therefore target plumbing for transitive browser users
# (currently ring via the model-runtime graph), not a general library choice.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2.17", features = ["js"] }

[features]
default = []
burn-webgpu = ["audio-analysis-transcription/burn-webgpu"]
